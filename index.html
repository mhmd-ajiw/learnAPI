<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning API</title>
</head>
<body>
    <div id="panel-registrasi" style="border: 1px solid #ccc; padding: 20px; width: 350px; font-family: sans-serif;">
    <h3 style="margin-top: 0;">Pendaftaran Asisten Praktikum</h3>
    
    <div style="margin-bottom: 10px;">
        <label>Nama Lengkap:</label><br>
        <input type="text" id="input-nama" placeholder="Masukkan nama Anda..." style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label>Fokus Mata Kuliah:</label><br>
        <input type="text" id="input-matkul" placeholder="Misal: Pemrograman Dasar C++" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <button id="btn-daftar" style="width: 100%; padding: 8px; cursor: pointer;">Kirim Data</button>
    
    <!-- Area untuk menampilkan pesan sukses atau error dari server -->
    <p id="notifikasi-sistem" style="font-size: 14px; text-align: center; height: 20px;"></p>
</div>

    <script src="app.js"></script>
</body>
</html>
